<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gliztygems Event Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lora:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceeee;--ink:#23282b;--mut:#636b70;--card:#fff;--line:#d2d6d8;--em:#454d52;--em2:#2b3033;--gold:#7b848a;--ok:#1d7a4d;--bad:#b3362f;--wait:#9a6b00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171a1b;--ink:#eceeee;--mut:#a3abaf;--card:#222628;--line:#394044;--em:#6a757b;--em2:#101213;--gold:#b4bbbf;--ok:#4cc48a;--bad:#ff7b72;--wait:#e0b84a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Lora,Georgia,'Times New Roman',serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.2;margin:0 0 .5rem}h1{font-size:clamp(2.1rem,7vw,3.8rem)}h2{font-size:1.9rem}h3{font-size:1.4rem}
a{color:inherit}.w{max-width:1080px;margin:0 auto;padding:0 18px}.sec{padding:44px 0}.mut{color:var(--mut)}
nav{position:sticky;top:0;z-index:5;background:var(--em2);color:#fff;padding-top:env(safe-area-inset-top,0px)}
nav .w{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.logo{font:700 1.5rem 'Playfair Display',serif;color:#fff;text-decoration:none;margin-right:auto}
nav a.l{color:#fff;text-decoration:none;font-size:.9rem;opacity:.85}nav a.l:hover,nav a.on{opacity:1;color:#fff;text-decoration:underline}
.hero{background:var(--em2);color:#fff;padding:0 0 56px}.hp{display:block;width:100%;height:auto;margin-bottom:40px}.hero .btn.g{background:#fff;color:#23282b}
.hero p{max-width:620px;opacity:.92;font-size:1.1rem}.hero h1{max-width:720px}
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 20px;font:700 .95rem Lora,Georgia,serif;cursor:pointer;text-decoration:none;background:var(--em);color:#fff}
.btn.g{background:var(--em2);color:#fff}.btn.o{background:none;border:1px solid var(--line);color:var(--ink)}.btn.s{padding:6px 12px;font-size:.82rem}.btn.r{background:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}.card.p0{padding:0;overflow:hidden}
.img{height:190px;background-size:cover;background-position:center 45%;display:flex;align-items:flex-end;padding:14px;color:#fff;font:700 1.8rem 'Playfair Display',serif}
.i0{background:linear-gradient(135deg,#3a4145,#8a9399)}.i1{background:linear-gradient(135deg,#565e63,#aeb5b9)}.i2{background:linear-gradient(135deg,#2b3033,#7b848a)}
.ph{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;background:#2b3033;cursor:zoom-in}.zm{position:fixed;inset:0;z-index:20;background:rgba(15,17,18,.94);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}.zm img{max-width:100%;max-height:100%;object-fit:contain}.bd{padding:18px}.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:.78rem;font-weight:700;border:1px solid currentColor}
.Confirmed,.Approved,.Completed,.Available{color:var(--ok)}.Pending,.In-Progress,.Maintenance{color:var(--wait)}.Declined,.Booked{color:var(--bad)}
label{display:block;font-weight:700;font-size:.85rem;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.err{color:var(--bad);font-size:.85rem;min-height:1.1em}.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .5s}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:420px}.cal b{text-align:center;font-size:.75rem;color:var(--mut)}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.cal button.bk{background:var(--bad);color:#fff;border-color:var(--bad);text-decoration:line-through;cursor:not-allowed}.cal button:disabled:not(.bk){opacity:.35;cursor:not-allowed}.cal button.sel{background:var(--em2);color:#fff;border-color:var(--em2);font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.code{font:700 1.8rem 'Playfair Display',serif;letter-spacing:.12em;color:var(--ink)}
.big{font:700 2.2rem 'Playfair Display',serif}.hid{display:none}footer{background:var(--em2);color:#d6dadc;padding:30px 0;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.btn{display:block;width:100%;max-width:360px;text-align:center;margin-top:10px}.btn.s{padding:9px 14px}
table .btn,div[style*="display:flex"] .btn,form[style*="display:flex"] .btn{display:inline-block;width:auto;margin-top:0}
nav{position:static}nav .w{flex-direction:column;align-items:stretch;gap:0}.logo{margin:0}.nb{display:flex;align-items:center;justify-content:space-between}.mb{background:none;border:1px solid #ffffff77;color:#fff;border-radius:8px;padding:8px 16px;font:700 .9rem Lora,Georgia,serif;cursor:pointer}.mb:focus-visible{outline:3px solid #fff;outline-offset:2px}#mn{margin-top:8px}nav a.l{display:block;padding:9px 0;border-top:1px solid #ffffff22}

const API='../backend/api/';let SERVER=false,BOOKED=new Set();
async function api(f,o={}){const r=await fetch(API+f,{method:o.m||'GET',headers:{'Content-Type':'application/json'},body:o.b?JSON.stringify(o.b):undefined,credentials:'same-origin'});let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,s:r.status,j}}
const mh=h=>({id:String(h.hall_id),name:h.name,cap:+h.capacity,price:+h.price,desc:h.description||'',fac:h.facilities||'',status:h.status,img:h.image_url||''});
const mb=b=>({id:String(b.booking_id),code:b.verification_code||'',name:b.customer_name,email:b.email,phone:b.phone,type:b.event_type,hall:String(b.hall_id),date:b.event_date,guests:+b.guests,info:b.additional_info||'',amount:+b.amount,status:b.status,created:b.created_at});
const pic=id=>IMG[id]||IMG[({1:'grand',2:'small',3:'open'})[id]];
async function detect(){try{const r=await api('halls.php');if(r.ok&&r.j.halls){SERVER=true;D.halls=r.j.halls.map(mh);calH=D.halls[0].id;admin=(await api('admin.php?action=me')).ok}}catch(e){}}
async function load(p,a){const h=await api('halls.php');if(h.ok)D.halls=h.j.halls.map(mh);
if(p==='availability'){BOOKED=new Set();const r=await api(`availability.php?hall_id=${calH}&month=${calM.getFullYear()}-${String(calM.getMonth()+1).padStart(2,'0')}`);(r.j.booked||[]).forEach(d=>BOOKED.add(calH+'|'+d))}
if((p==='my'||p==='confirm')&&a[0]){const c=a[0].toUpperCase();D.bookings=D.bookings.filter(x=>x.code!==c);D.tasks=[];const r=await api('bookings.php?code='+encodeURIComponent(c));
if(r.ok){const b=mb(r.j.booking);D.bookings.push(b);const t=await api('tasks.php?code='+encodeURIComponent(c));if(t.ok)D.tasks=t.j.tasks.map(x=>({id:String(x.task_id),booking:b.id,title:x.title,deadline:x.deadline,status:x.status}))}}
if(p==='admin'&&admin){const [b,y]=await Promise.all([api('bookings.php'),api('admin.php?action=payments')]);if(b.s===401){admin=false;location.hash='#/login';return}
D.bookings=(b.j.bookings||[]).map(mb);D.payments=(y.j.payments||[]).map(x=>({id:x.payment_id,booking:String(x.booking_id),amount:+x.amount,status:x.status,last4:x.card_last4,date:x.paid_at}))}}
const app=$('#app');let calM=new Date(),calH='grand',calSel='';
const EV=['Wedding','Birthday','Conference','Funeral reception','Corporate event','Graduation','Other'];

function card(h,i){return `<div class="card p0">${pic(h.id)?`<img class="ph" src="${pic(h.id)}" alt="${esc(h.name)}" onclick="zoom('${h.id}')">`:`<div class="img i${i%3}"></div>`}<div class="bd"><h3>${esc(h.name)}</h3><div>${st(h.status)}</div>
<p class="mut">${esc(h.desc)}</p><p><b>Capacity:</b> ${h.cap} guests<br><b>Price:</b> ${money(h.price)}</p>
<div id="d-${h.id}" class="hid mut"><b>Facilities:</b><ul style="margin:6px 0 0;padding-left:20px">${h.fac.split(',').map(x=>`<li>${esc(x.trim())}</li>`).join('')}</ul></div>
<p><button class="btn o s" onclick="$('#d-${h.id}').classList.toggle('hid')">View Details</button> <a class="btn s" href="#/book/${h.id}">Book This Hall</a></p></div></div>`}
function zoom(id){const d=document.createElement('div');d.className='zm';d.innerHTML='<img src="'+pic(id)+'" alt="">';d.onclick=()=>d.remove();document.body.appendChild(d)}
function match(){const g=+$('#mg').value;let o='';if(!g||g<1){o='<p class="err">Enter a valid number of guests.</p>'}else{
const ok=D.halls.filter(h=>h.cap>=g&&h.status==='Available');
o=ok.length?`<p><b>${ok.length} hall(s) can host ${g} guests:</b></p><div class="grid">${ok.map(card).join('')}</div>`:`<p class="err">No hall can host ${g} guests. The largest available capacity is ${Math.max(0,...D.halls.filter(h=>h.status==='Available').map(h=>h.cap))}. Try a smaller guest count.</p>`}
$('#mr').innerHTML=o}
const smart=()=>`<div class="card"><h3>Smart Hall Match</h3><p class="mut">Tell us how many guests you expect and we will show every hall that fits.</p>

pay(a){const b=D.bookings.find(x=>x.id===a[0]);if(!b)return nf();if(b.status==='Confirmed')return `<div class="w sec"><p>This booking is already paid. <a href="#/confirm/${b.code}">View confirmation</a></p></div>`;
return `<div class="w sec" style="max-width:520px"><h2>Payment</h2><div class="card"><p class="mut">${esc(hall(b.hall).name)} on ${b.date}</p><div class="big">${money(b.amount)}</div></div>

login(){return `<div class="w sec" style="max-width:420px"><h2>Administrator login</h2><form onsubmit="doLogin(event)"><label for="u">Username</label><input id="u" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><p class="err" id="er"></p><button class="btn">Log in</button></form><p class="mut">Demo credentials: admin / admin123</p></div>`},
admin(a){if(!admin){location.hash='#/login';return ''}const t=a[0]||'overview',B=D.bookings,tabs=['overview','bookings','payments','customers','halls'];
const T=`<div class="tabs">${tabs.map(x=>`<a class="btn s ${x===t?'':'o'}" href="#/admin/${x}">${x[0].toUpperCase()+x.slice(1)}</a>`).join('')}<button class="btn r s" onclick="logout()">Log out</button></div>`;let o='';
if(t==='overview'){const c=s=>B.filter(b=>b.status===s).length,paid=D.payments.filter(p=>p.status==='Approved').reduce((s,p)=>s+p.amount,0);
o=`<div class="grid">${[['Total bookings',B.length],['Confirmed',c('Confirmed')],['Pending',c('Pending')],['Declined',c('Declined')],['Simulated payments',D.payments.length],['Approved total',money(paid)]].map(x=>`<div class="card"><div class="mut">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div>`}
if(t==='bookings')o=`<div class="row"><input id="q" placeholder="Search name, code or email" oninput="aTable()"><select id="sf" onchange="aTable()"><option value="">All statuses</option><option>Confirmed</option><option>Pending</option><option>Declined</option></select></div><div class="scroll card" id="bt" style="margin-top:12px"></div>`;
if(t==='payments')o=`<div class="scroll card"><table><tr><th>Date</th><th>Booking</th><th>Card</th><th>Amount</th><th>Status</th></tr>${D.payments.map(p=>{const b=B.find(x=>x.id===p.booking)||{};return `<tr><td>${p.date.slice(0,10)}</td><td>${esc(b.name)} (${esc(b.code)})</td><td>**** ${p.last4}</td><td>${money(p.amount)}</td><td>${st(p.status)}</td></tr>`}).join('')||'<tr><td>No payments yet.</td></tr>'}</table></div>`;
if(t==='customers'){const m={};B.forEach(b=>{m[b.email]=m[b.email]||{n:b.name,e:b.email,p:b.phone,c:0};m[b.email].c++});o=`<div class="scroll card"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Bookings</th></tr>${Object.values(m).map(c=>`<tr><td>${esc(c.n)}</td><td>${esc(c.e)}</td><td>${esc(c.p)}</td><td>${c.c}</td></tr>`).join('')||'<tr><td>No customers yet.</td></tr>'}</table></div>`}
if(t==='halls')o=`<div class="grid">${D.halls.map(h=>`<form class="card" onsubmit="saveHall(event,'${h.id}')"><h3>${esc(h.name)}</h3><label>Name</label><input name="name" value="${esc(h.name)}"><div class="row"><div><label>Capacity</label><input name="cap" type="number" min="1" value="${h.cap}"></div><div><label>Price (₦)</label><input name="price" type="number" min="0" value="${h.price}"></div></div><label>Status</label><select name="status">${['Available','Maintenance'].map(s=>`<option ${s===h.status?'selected':''}>${s}</option>`).join('')}</select><label>Description</label><textarea name="desc" rows="2">${esc(h.desc)}</textarea><label>Facilities</label><input name="fac" value="${esc(h.fac)}"><p><button class="btn s">Save hall</button></p></form>`).join('')}</div>`;
return `<div class="w sec"><h2>Management dashboard</h2>${T}${o}</div>`}};
const nf=()=>'<div class="w sec"><h2>Not found</h2><p><a href="#/">Back to home</a></p></div>';
function detail(b){return `<p><b>${esc(b.name)}</b> · ${esc(b.email)} · ${esc(b.phone)}</p><p>${esc(b.type)} at <b>${esc(hall(b.hall).name)}</b> on <b>${b.date}</b> for ${b.guests} guests</p><p>Amount ${money(b.amount)} · Booking ${st(b.status)} · Payment ${st(({Confirmed:'Approved',Declined:'Declined',Pending:'Pending'})[b.status])}</p>${b.info?`<p class="mut">${esc(b.info)}</p>`:''}`}
function tracker(b){const T=D.tasks.filter(x=>x.booking===b.id),p=pct(b.id),n=s=>T.filter(x=>x.status===s).length;
return `<h3>Your preparation tasks</h3><div class="card"><div style="display:flex;justify-content:space-between"><b>Overall progress</b><b>${p}%</b></div><div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
<p class="mut">${T.length} tasks · ${n('Pending')} pending · ${n('In Progress')} in progress · ${n('Completed')} completed</p></div>
<form class="card" style="margin:14px 0" onsubmit="addTask(event,'${b.id}','${b.code}')"><div class="row"><div><label for="tt">Task title</label><input id="tt"></div><div><label for="td">Deadline</label><input id="td" type="date"></div><div><label for="ts">Status</label><select id="ts"><option>Pending</option><option>In Progress</option><option>Completed</option></select></div></div><input type="hidden" id="te"><p class="err" id="er"></p><button class="btn s" id="tb">Add task</button></form>
<div class="scroll card"><table><tr><th>Task</th><th>Deadline</th><th>Status</th><th></th></tr>${T.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.deadline||'No deadline'}</td><td><select onchange="setSt('${x.id}',this.value,'${b.code}')">${['Pending','In Progress','Completed'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn o s" onclick="editTask('${x.id}')">Edit</button> <button class="btn r s" onclick="delTask('${x.id}','${b.code}')">Delete</button></td></tr>`).join('')||'<tr><td>No tasks yet. Add your first one above.</td></tr>'}</table></div>`}

async function submitBook(e){e.preventDefault();const v=id=>$('#'+id).value.trim(),er=m=>$('#er').textContent=m;
const b={name:v('n'),email:v('e'),phone:v('p'),type:v('t'),hall:v('h'),date:v('d'),guests:+v('g'),info:v('i')},H=hall(b.hall);
if(b.name.length<3)return er('Enter your full name.');if(!/^\S+@\S+\.\S+$/.test(b.email))return er('Enter a valid email address.');
if(!/^[+\d][\d\s-]{6,17}$/.test(b.phone))return er('Enter a valid phone number.');if(!b.date||b.date<today())return er('Choose a date that is today or later.');
if(!(b.guests>0))return er('Enter the number of expected guests.');if(H.status!=='Available')return er('That hall is not available for booking right now.');
if(b.guests>H.cap)return er(`${H.name} holds up to ${H.cap} guests. Choose a bigger hall or fewer guests.`);
if(SERVER){const r=await api('bookings.php',{m:'POST',b:{name:b.name,email:b.email,phone:b.phone,event_type:b.type,hall_id:b.hall,event_date:b.date,guests:b.guests,additional_info:b.info}});
if(!r.ok)return er(r.j.error||'Could not save your booking.');D.bookings.push({...b,id:String(r.j.booking_id),code:'',status:'Pending',amount:r.j.amount,created:new Date().toISOString()});location.hash='#/pay/'+r.j.booking_id;return}
if(taken(b.hall,b.date))return er(`${H.name} is already confirmed on ${b.date}. Pick another date.`);
b.id=uid();b.code='';b.status='Pending';b.amount=H.price;b.created=new Date().toISOString();D.bookings.push(b);save();location.hash='#/pay/'+b.id}
const luhn=s=>{let t=0,f=false;for(let i=s.length-1;i>=0;i--){let d=+s[i];if(f){d*=2;if(d>9)d-=9}t+=d;f=!f}return t%10===0};
async function doPay(e,id){e.preventDefault();const v=x=>$('#'+x).value.trim(),er=m=>$('#er').textContent=m,b=D.bookings.find(x=>x.id===id);
const num=v('cc').replace(/\s/g,''),ex=v('cx').match(/^(\d{2})\/(\d{2})$/);
if(v('cn').length<3)return er('Enter the cardholder name.');if(!/^\d{16}$/.test(num)||!luhn(num))return er('Enter a valid 16-digit card number.');
if(!ex||+ex[1]<1||+ex[1]>12||new Date(2000+ +ex[2],+ex[1],1)<=new Date())return er('Enter a valid future expiry date as MM/YY.');
if(!/^\d{3,4}$/.test(v('cv')))return er('Enter the 3 or 4 digit CVV.');
if(SERVER){const r=await api('payment.php',{m:'POST',b:{booking_id:+id,email:b.email,cardholder:v('cn'),card_number:num,expiry:v('cx'),cvv:v('cv')}});
if(r.ok&&r.j.status==='Approved'){b.status='Confirmed';b.code=r.j.verification_code;location.hash='#/confirm/'+b.code;return}
if(r.s===402){b.status='Declined';app.innerHTML=`<div class="w sec" style="max-width:520px"><h2>Payment declined</h2><p>${esc(r.j.message)}</p><a class="btn" href="#/book/${b.hall}">Start a new booking</a></div>`;return}
return er(r.j.error||'Payment failed. Please try again.')}
let ok=!num.endsWith('0002')&&!taken(b.hall,b.date);
D.payments.push({id:uid(),booking:b.id,amount:b.amount,status:ok?'Approved':'Declined',last4:num.slice(-4),date:new Date().toISOString()});
if(ok){b.status='Confirmed';b.code='GG-'+uid().toUpperCase().slice(0,6);save();location.hash='#/confirm/'+b.code}
else{b.status='Declined';save();app.innerHTML=`<div class="w sec" style="max-width:520px"><h2>Payment declined</h2><p>${taken(b.hall,b.date)?'Someone confirmed this date first.':'The card was declined.'} Your booking was not confirmed and no money moved.</p><a class="btn" href="#/book/${b.hall}">Start a new booking</a></div>`}}
async function addTask(e,id,code){e.preventDefault();const t=$('#tt').value.trim(),eid=$('#te').value;if(!t)return $('#er').textContent='Enter a task title.';
if(SERVER){const q={code,title:t,deadline:$('#td').value,status:$('#ts').value},r=eid?await api('tasks.php',{m:'PUT',b:{...q,task_id:+eid}}):await api('tasks.php',{m:'POST',b:q});if(!r.ok)return $('#er').textContent=r.j.error||'Could not save the task.';return render()}
if(eid){const x=D.tasks.find(k=>k.id===eid);Object.assign(x,{title:t,deadline:$('#td').value,status:$('#ts').value})}else D.tasks.push({id:uid(),booking:id,title:t,deadline:$('#td').value,status:$('#ts').value});save();render()}
function editTask(id){const x=D.tasks.find(k=>k.id===id);$('#tt').value=x.title;$('#td').value=x.deadline;$('#ts').value=x.status;$('#te').value=id;$('#tb').textContent='Save task';$('#tt').focus()}
async function setSt(id,v,code){const x=D.tasks.find(k=>k.id===id);if(SERVER){await api('tasks.php',{m:'PUT',b:{code,task_id:+id,title:x.title,deadline:x.deadline||'',status:v}})}else{x.status=v;save()}render()}
async function delTask(id,code){if(!confirm('Delete this task?'))return;if(SERVER)await api('tasks.php',{m:'DELETE',b:{code,task_id:+id}});else{D.tasks=D.tasks.filter(k=>k.id!==id);save()}render()}
async function doLogin(e){e.preventDefault();if(SERVER){const r=await api('admin.php?action=login',{m:'POST',b:{username:$('#u').value,password:$('#pw').value}});if(r.ok){admin=true;location.hash='#/admin'}else $('#er').textContent=r.j.error||'Wrong username or password.';return}if($('#u').value==='admin'&&$('#pw').value==='admin123'){admin=true;try{sessionStorage.setItem('ggadm','1')}catch(x){}location.hash='#/admin'}else $('#er').textContent='Wrong username or password.'}
async function logout(){if(SERVER)await api('admin.php?action=logout');admin=false;try{sessionStorage.removeItem('ggadm')}catch(x){}location.hash='#/'}
async function saveHall(e,id){e.preventDefault();const f=new FormData(e.target),h=hall(id),n={name:f.get('name'),cap:+f.get('cap'),price:+f.get('price'),status:f.get('status'),desc:f.get('desc'),fac:f.get('fac')};if(SERVER){const r=await api('halls.php',{m:'PUT',b:{hall_id:+id,name:n.name,capacity:n.cap,price:n.price,status:n.status,description:n.desc,facilities:n.fac,image_url:h.img||''}});if(!r.ok)return alert(r.j.error||'Could not save the hall.')}else{Object.assign(h,n);save()}alert('Hall saved.');render()}
function aTable(){const q=$('#q').value.toLowerCase(),s=$('#sf').value;const L=D.bookings.filter(b=>(!s||b.status===s)&&(b.name+b.code+b.email).toLowerCase().includes(q));
$('#bt').innerHTML=`<table><tr><th>Code</th><th>Customer</th><th>Hall</th><th>Event date</th><th>Guests</th><th>Amount</th><th>Status</th><th>Booked on</th></tr>${L.map(b=>`<tr><td>${b.code||'-'}</td><td>${esc(b.name)}</td><td>${esc(hall(b.hall).name)}</td><td>${b.date}</td><td>${b.guests}</td><td>${money(b.amount)}</td><td>${st(b.status)}</td><td>${b.created.slice(0,10)}</td></tr>`).join('')||'<tr><td>No bookings match.</td></tr>'}</table>`}
function tm(){const o=$('#mn').classList.toggle('hid');$('#mb').setAttribute('aria-expanded',String(!o));$('#mb').textContent=o?'Menu':'Close'}
async function render(){$('#mn').classList.add('hid');$('#mb').textContent='Menu';$('#mb').setAttribute('aria-expanded','false');const [p,...a]=(location.hash.slice(2)||'home').split('/');if(SERVER)await load(p,a);const f=pages[p]||(()=>nf());app.innerHTML=f(a);
if(p==='admin'&&(a[0]==='bookings'))aTable();$('#mode').textContent=SERVER?'Connected to the MySQL database.':'Demo mode: data is saved in this browser.';$('#auth').textContent=admin?'Dashboard':'Login';$('#auth').href=admin?'#/admin':'#/login'}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});detect().then(render);
</script></body></html>
